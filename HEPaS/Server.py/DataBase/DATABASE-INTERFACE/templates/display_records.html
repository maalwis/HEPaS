<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Records</title>
</head>
<body>
    <h1>Display Records</h1>
    <table border="1">
        <tr>
            {% for column_name in columns %}
                <th>{{ column_name }}</th>
            {% endfor %}
        </tr>
        {% for record in records %}
            <tr>
                {% for value in record %}
                    <td>{{ value }}</td>
                {% endfor %}
            </tr>
        {% endfor %}
    </table>
</body>
</html>
